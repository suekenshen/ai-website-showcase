name: Cache website screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/**
      - .github/workflows/cache-screenshots.yml
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture and cache screenshots
        run: python scripts/cache_screenshots.py
      - name: Commit cached screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Cache website preview screenshots"
            git push
          fi
