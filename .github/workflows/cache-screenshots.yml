name: Cache website screenshots
on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: 'Re-capture all sites (rather than only missing/problem previews)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/**
      - .github/workflows/cache-screenshots.yml
permissions:
  contents: write
concurrency:
  group: screenshots-main
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot browser
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture and validate screenshots
        env:
          REFRESH_ALL: ${{ inputs.refresh_all && '1' || '0' }}
        run: python scripts/cache_screenshots.py
      - name: Commit validated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh invalid website preview screenshots"
            git pull --rebase
            git push
          fi
